[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antinfsw"
version = "1.0.0"
description = "Telegram group moderation bot for NSFW media detection."
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27,<1",
    "numpy>=2.0,<3",
    "Pillow>=10.4,<13",
    "transformers>=4.45,<6",
    "torch>=2.5,<3",
    "av>=14,<20",
    "rlottie-python[full]>=1.3.7",
    "mysql-connector-python>=9.0,<10",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["antinfsw*"]
